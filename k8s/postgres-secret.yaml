# Replace base64 values with your own if needed:
#   echo -n 'appuser' | base64
#   echo -n 'apppass' | base64
#   echo -n 'appdb'   | base64
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: microdemo
type: Opaque
data:
  POSTGRES_USER: YXBwdXNlcg==        # appuser
  POSTGRES_PASSWORD: YXBwcGFzcw==    # apppass
  POSTGRES_DB: YXBwZGI=              # appdb
