version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [ "mongodata:/data/db" ]

  fastapi-service:
    build: ./fastapi-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    ports: ["5000:5000"]
    depends_on: [ postgres ]

  node-service:
    build: ./node-service
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/appdb
    ports: ["3000:3000"]
    depends_on: [ mongo ]

volumes:
  pgdata:
  mongodata:
